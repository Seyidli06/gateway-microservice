spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/gateway}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/gateway/protocol/openid-connect/certs}

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true

app:
  security:
    cors:
      allowed-origins:
        - ${FRONTEND_ORIGIN:http://localhost:5173}