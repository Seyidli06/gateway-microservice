spring:
  application:
    name: api-gateway

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  security:
    cors:
      allowed-origins:
        - ${FRONTEND_ORIGIN:http://localhost:5173}