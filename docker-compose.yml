services:

  profile-db:
    image: postgres:16-alpine
    container_name: gateway-profile-db

    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD_FILE: /run/secrets/profile_db_password

    secrets:
      - source: profile_db_password
        target: profile_db_password

    volumes:
      - profile-db-data:/var/lib/postgresql/data

    networks:
      - profile-data-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U profile_user -d profile_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  feedback-db:
    image: postgres:16-alpine
    container_name: gateway-feedback-db

    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD_FILE: /run/secrets/feedback_db_password

    secrets:
      - source: feedback_db_password
        target: feedback_db_password

    volumes:
      - feedback-db-data:/var/lib/postgresql/data

    networks:
      - feedback-data-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U feedback_user -d feedback_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  rate-limit-redis:
    image: redis:7-alpine
    container_name: gateway-rate-limit-redis

    networks:
      - rate-limit-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: gateway-keycloak

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak-admin

    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

    ports:
      - "8180:8080"

    networks:
      - auth-network

    restart: unless-stopped


  profile-service:
    image: gateway-microservices/profile-service:local

    build:
      context: .
      dockerfile: profile-service/Dockerfile

    container_name: profile-service

    environment:
      SPRING_PROFILES_ACTIVE: docker,prod

      PROFILE_DB_URL: jdbc:postgresql://profile-db:5432/profile_db
      PROFILE_DB_USERNAME: profile_user

    expose:
      - "9091"

    networks:
      - edge-network
      - profile-data-network

    depends_on:
      profile-db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9091/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    secrets:
      - source: profile_db_password
        target: db.password


  feedback-service:
    image: gateway-microservices/feedback-service:local

    build:
      context: .
      dockerfile: feedback-service/Dockerfile

    container_name: feedback-service

    environment:
      SPRING_PROFILES_ACTIVE: docker,prod

      FEEDBACK_DB_URL: jdbc:postgresql://feedback-db:5432/feedback_db
      FEEDBACK_DB_USERNAME: feedback_user

    secrets:
      - source: feedback_db_password
        target: db.password

    expose:
      - "9092"

    networks:
      - edge-network
      - feedback-data-network

    depends_on:
      feedback-db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9092/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  api-gateway:
    image: gateway-microservices/api-gateway:local

    build:
      context: .
      dockerfile: api-gateway/Dockerfile

    container_name: api-gateway

    environment:
      SPRING_PROFILES_ACTIVE: docker,prod

      PROFILE_SERVICE_URL: http://profile-service:9091
      FEEDBACK_SERVICE_URL: http://feedback-service:9092

      REDIS_HOST: rate-limit-redis
      REDIS_PORT: 6379

      RATE_LIMIT_REPLENISH_RATE: 5
      RATE_LIMIT_BURST_CAPACITY: 10

      JWT_ISSUER_URI: http://localhost:8180/realms/gateway

      JWT_JWK_SET_URI: http://keycloak:8080/realms/gateway/protocol/openid-connect/certs

    ports:
      - "9090:9090"

    networks:
      - edge-network
      - rate-limit-network
      - auth-network

    depends_on:
      profile-service:
        condition: service_healthy

      feedback-service:
        condition: service_healthy

      rate-limit-redis:
        condition: service_healthy

      keycloak:
        condition: service_started

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:

  profile-db-data:

  feedback-db-data:


networks:

  edge-network:
    driver: bridge

  profile-data-network:
    driver: bridge
    internal: true

  feedback-data-network:
    driver: bridge
    internal: true

  rate-limit-network:
    driver: bridge
    internal: true

  auth-network:
    driver: bridge


secrets:

  profile_db_password:
    file: ./secrets/profile_db_password.txt

  feedback_db_password:
    file: ./secrets/feedback_db_password.txt