name: Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  filesystem-scan:
    name: Dependency and Config Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan dependencies and repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln,misconfig


  image-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create temporary CI secrets
        run: |
          mkdir -p secrets
          printf '%s' 'ci_profile_password' > secrets/profile_db_password.txt
          printf '%s' 'ci_feedback_password' > secrets/feedback_db_password.txt

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build application images
        run: |
          docker compose build \
            profile-service \
            feedback-service \
            api-gateway

      - name: Scan Profile Service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gateway-microservices/profile-service:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Feedback Service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gateway-microservices/feedback-service:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan API Gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gateway-microservices/api-gateway:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH