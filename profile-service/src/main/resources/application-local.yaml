spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${PROFILE_DB_URL:jdbc:postgresql://localhost:5434/profile_db}
    username: ${PROFILE_DB_USERNAME:profile_user}
    password: ${PROFILE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true